plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.9.436" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def minGradleVersion = org.gradle.util.GradleVersion.version("9.0")
if (org.gradle.util.GradleVersion.current() < minGradleVersion) {
    throw new GradleException("This project requires Gradle ${minGradleVersion.version}+ (via ./gradlew). Current: ${org.gradle.util.GradleVersion.current().version}")
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    loom {
        silentMojangMappingsLicense()
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            // location of the maven that hosts JEI files before January 2023
            name = "Progwml6's maven"
            url = "https://dvs1.progwml6.com/files/maven/"
        }
        maven {
            // location of the maven that hosts JEI files since January 2023
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name "cardinal components, playerabilitylib, trinkets"
            url "https://maven.ladysnake.org/releases"
        }

        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/'
        }

        // Refabricated REPO -------------------
        maven {
            name = "Greenhouse Maven"
            url = 'https://maven.greenhouse.lgbt/releases/'
        }

        maven { url "https://mvn.devos.one/releases/" } // Porting Lib
        maven {
            url "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes (Required by Porting Lib)
            content {
                includeGroup "com.jamieswhiteshirt"
            }
        }
        maven {
            url "https://jitpack.io/" // Fabric ASM
            content {
                excludeGroup "io.github.fabricators_of_create"
            }
        }
        //--------------------------------------

        maven {
            url = "https://maven.midnightdust.eu/releases"
        }

        maven { url = "https://maven.shedaniel.me" }

        maven { url = "https://maven.bawnorton.com/releases" }

        maven { url = 'https://www.jitpack.io' }

        maven {
            name = "Ladysnake Mods"
            url = 'https://maven.ladysnake.org/releases'
        }

        mavenLocal()
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        withSourcesJar()
    }
}
