architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/muffinsthaidelight.accesswidener")
}

sourceSets.main {
    resources {
        srcDirs += "src/generated/resources/"
    }
}

dependencies {
    modCompileOnly("com.github.FireMuffin303:MuffinsEffectRenderAPI:${rootProject.muffins_api_version}")
    compileOnly("org.spongepowered:mixin:0.8.5")
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
}
