plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            inherit server
            name "NeoForge Data Generation"
            programArg "--mod"
            programArg "muffins_thaidelight"
            programArg "--all"
            programArg "--output"
            programArg file("src/generated/resources/").getAbsolutePath()
            programArg "--existing"
            programArg file("src/main/resources/").getAbsolutePath()
        }
    }
}

sourceSets.main {
    resources {
        srcDirs += "src/generated/resources/"
    }
}

configurations {
    neoForge
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    add("neoForge", "net.neoforged:neoforge:${rootProject.neoforge_version}")
    modImplementation("com.github.FireMuffin303:MuffinsEffectRenderAPI:${rootProject.muffins_api_version}")

    modImplementation("maven.modrinth:farmers-delight:${rootProject.farmersdelight_neoforge_version}")

    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
